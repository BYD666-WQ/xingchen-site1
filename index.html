<script src="assets/app.js"></script>
<script>
(function(){
  var DATA=null,CUR='newhk',timer=null,REVEAL=null,REFRESHING=false,REVEAL_CFG=null,revealTimers=[],waitPoll=null,HIST_OPEN=false,HIST_LIMIT=5;
  var BOARDS=[
    ['本期资料','内幕/精选'],['历史开奖','往期归档'],['玄机诗象','本期观点'],
    ['生肖号码','号码对照'],['资料大全','全部资料'],['图库','图集'],
    ['规律走势','统计图'],['开奖记录','近期'],['使用说明','关于本站']
  ];
  var ZODIAC=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  var ZN={鼠:'04 16 28 40',牛:'03 15 27 39',虎:'02 14 26 38',兔:'01 13 25 37 49',龙:'12 24 36 48',蛇:'11 23 35 47',马:'10 22 34 46',羊:'09 21 33 45',猴:'08 20 32 44',鸡:'07 19 31 43',狗:'06 18 30 42',猪:'05 17 29 41'};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function view(k){return DATA&&DATA.games&&DATA.games[k]}
  function setLoading(txt,err){var e=document.getElementById('loading');if(!e)return;e.textContent=txt;e.className='loading'+(err?' err':'');if(!txt)e.style.display='none'}
  function renderBalls(v,numsOverride,revealed,phase,issueOverride){
    var nums=numsOverride||(v&&v.nums)||[];
    var issue=issueOverride||(v&&(v.issue||v.currentIssue));
    document.getElementById('issueTop').textContent=XC.fmtIssue(issue);
    var show=(phase==='waiting')?0:(phase==='revealing'?(revealed||0):nums.length);
    var h='';
    for(var i=0;i<7;i++){
      if(i===6)h+='<span class="plus-sep">+</span>';
      if(i<show&&nums[i]&&nums[i].c){h+='<div class="nc '+XC.numClass(nums[i].c)+'"><b>'+esc(nums[i].c)+'</b><i>'+esc(nums[i].z)+'</i></div>'}
      else{h+='<div class="nc pending"><b>?</b><i>?</i></div>'}
    }
    document.getElementById('numRow').innerHTML=h;
  }
  function revealCfg(){var c=null;try{c=DATA&&DATA.config&&DATA.config.reveal}catch(e){};var o={mode:'fixed',seconds:10,min:8,max:15,specialExtra:5};if(c){if(c.mode==='random'||c.mode==='fixed')o.mode=c.mode;if(isFinite(c.seconds))o.seconds=Math.max(1,Math.min(120,+c.seconds));if(isFinite(c.min))o.min=Math.max(1,Math.min(120,+c.min));if(isFinite(c.max))o.max=Math.max(1,Math.min(120,+c.max));if(isFinite(c.specialExtra))o.specialExtra=Math.max(0,Math.min(120,+c.specialExtra))}return o}
  function rngSeed(s){var h=2166136261;for(var i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function rng(seed){var s=seed>>>0||1;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return ((t^(t>>>14))>>>0)/4294967296}}
  function revealTimeline(issue){var c=REVEAL_CFG||revealCfg(),out=[],t=1500;out.push(t);var r=c.mode==='random'?rng(rngSeed('v'+issue)):null;for(var i=1;i<=6;i++){var gap=c.mode==='random'?(c.min+Math.floor(r()*(c.max-c.min+1))):c.seconds;t+=gap*1000;if(i===6)t+=(c.specialExtra||0)*1000;out.push(t)}return out}
  function clearRevealTimers(){revealTimers.forEach(function(x){clearTimeout(x)});revealTimers=[]}
  function revealStatus(txt){var e=document.getElementById('revealStatus');if(!e)return;e.hidden=!txt;e.textContent=txt||''}
  function localDone(issue){try{var s=JSON.parse(localStorage.getItem('xc-site1-vf-'+XC.short(issue))||'null');return !!(s&&String(s.issue)===String(issue)&&s.nums&&s.nums.length===7)}catch(e){return false}}
  function saveDone(issue,nums){try{localStorage.setItem('xc-site1-vf-'+XC.short(issue),JSON.stringify({issue:issue,nums:nums}))}catch(e){}}
  function startReveal(issue,nums){
    clearRevealTimers();if(waitPoll){clearTimeout(waitPoll);waitPoll=null}
    REVEAL_CFG=revealCfg();var tl=revealTimeline(issue);
    REVEAL={phase:'revealing',issue:issue,nums:nums,revealed:0,start:Date.now(),tl:tl};
    renderBalls(null,nums,0,'revealing',issue);revealStatus('开奖中… 0/7');
    tl.forEach(function(ms,i){revealTimers.push(setTimeout(function(){
      if(!REVEAL||REVEAL.phase!=='revealing'||String(REVEAL.issue)!==String(issue))return;
      REVEAL.revealed=i+1;renderBalls(null,nums,REVEAL.revealed,'revealing',issue);revealStatus('开奖中… '+(i+1)+'/7');
      if(i===6)revealTimers.push(setTimeout(function(){finishReveal(issue,nums)},1200));
    },ms))});
  }
  function finishReveal(issue,nums){
    if(!REVEAL||String(REVEAL.issue)!==String(issue))return;
    clearRevealTimers();REVEAL.phase='done';revealStatus('');
    var v=view('newhk');if(v){
      v.issue=parseInt(issue,10)||v.issue;v.currentIssue=v.issue;v.nums=nums;v.state='已开奖';
      var hist=(v.history||[]).filter(function(h){return String(h.issue)!==String(issue)});
      hist.unshift({issue:issue,nums:nums});v.history=hist;
      v.nextIssue=(parseInt(issue,10)||0)+1;
      var t=(DATA.config.drawTimes.newhk||{});v.nextTime=XC.nextAt(t.time,t.days,new Date());
      renderBalls(v,nums,7,'done',issue);renderHistory(v);
      document.getElementById('zodNow').textContent='当前：'+v.name+' · '+XC.fmtIssue(v.issue);
      saveDone(issue,nums);tick();
    }
  }
  function startWaiting(issue){
    clearRevealTimers();if(waitPoll){clearTimeout(waitPoll);waitPoll=null}
    REVEAL={phase:'waiting',issue:issue,nums:[],revealed:0,start:Date.now()};
    renderBalls(null,[],0,'waiting',issue);revealStatus('开奖中… 0/7');
    waitPoll=setTimeout(function(){waitPoll=null;load()},10000);
  }
  function issueDraw(issue){
    var md=DATA&&DATA.manualRaw;if(!md)return null;
    var want=String(issue);
    var curIssue=parseInt(md.issue,10)||0;
    var candidates=[];
    if(String(curIssue)===want)candidates.push({issue:curIssue,nums:md.nums,numsEnc:md.numsEnc,publishedAt:md.publishedAt,visibleFrom:md.visibleFrom});
    (md.history||[]).forEach(function(h){if(String(h.issue)===want)candidates.push({issue:h.issue,nums:h.nums,numsEnc:h.numsEnc,publishedAt:h.publishedAt,visibleFrom:h.visibleFrom})});
    for(var j=0;j<candidates.length;j++){
      var x=candidates[j],nums=XC.norm(x.nums||[]);
      if(!nums.length&&x.numsEnc){try{var dec=XC.norm(XC.vfDec(x.numsEnc));if(dec&&dec.length===7)nums=dec}catch(e){}}
      if(nums.length===7){
        var pub=Date.parse(x.publishedAt||''),vis=Date.parse(x.visibleFrom||'');
        var visible=(!isFinite(pub)&&!isFinite(vis))||(isFinite(pub)&&pub<=Date.now())||(isFinite(vis)&&vis<=Date.now());
        return {issue:parseInt(issue,10)||0,nums:nums,visible:visible,when:Math.max(isFinite(pub)?pub:0,isFinite(vis)?vis:0)};
      }
    }
    return null;
  }
  function currentDrawData(){
    var md=DATA&&DATA.manualRaw;if(!md)return null;
    return issueDraw(md.issue)||{issue:parseInt(md.issue,10)||0,nums:[]};
  }
  function maybeReveal(freshOnly){
    if(CUR!=='newhk')return false;
    var target=(REVEAL&&REVEAL.phase==='waiting')?REVEAL.issue:null;
    var c=target?issueDraw(target):currentDrawData();
    if(freshOnly&&(!c||!c.nums||!c.nums.length)){
      var md=DATA&&DATA.manualRaw;var h=md&&(md.history||[])[0];
      if(h)c=issueDraw(h.issue);
    }
    if(!c||!c.visible||c.nums.length!==7)return false;
    if(freshOnly&&(!c.when||Date.now()-c.when>10*60*1000))return false;
    if(localDone(c.issue))return false;
    if(REVEAL&&String(REVEAL.issue)===String(c.issue)&&(REVEAL.phase==='revealing'||REVEAL.phase==='done'))return false;
    startReveal(c.issue,c.nums);return true;
  }
  function tick(){
    if(!DATA)return;var v=view(CUR);if(!v)return;
    if(CUR==='newhk'&&REVEAL&&(REVEAL.phase==='waiting'||REVEAL.phase==='revealing')){
      document.getElementById('h').textContent='00';document.getElementById('m').textContent='00';document.getElementById('s').textContent='00';
      document.getElementById('nextIssueLabel').textContent='第'+XC.short(REVEAL.issue)+'期';return;
    }
    var target=v.nextTime?new Date(v.nextTime):null;var s=target?Math.max(0,Math.floor((target-new Date())/1000)):0;
    if(CUR==='newhk'&&!REVEAL&&s<=0&&v.pendingIssue){if(!maybeReveal())startWaiting(v.pendingIssue)}
    var hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
    document.getElementById('h').textContent=XC.p2(hh);document.getElementById('m').textContent=XC.p2(mm);document.getElementById('s').textContent=XC.p2(ss);
    document.getElementById('nextIssueLabel').textContent='第'+XC.short(v.nextIssue||'')+'期';
  }
  function startTick(){if(timer)clearInterval(timer);tick();timer=setInterval(tick,1000)}
  function setActiveTab(){document.querySelectorAll('#channels .ch').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-k')===CUR)})}
  function renderBoards(){
    document.getElementById('boards').innerHTML=BOARDS.map(function(b,i){return '<a class="g3" href="'+(i===0?'data.html#pick':(i===1?'#histWrap':(i===2?'#poemWrap':(i===3?'#zodWrap':(i===4?'data.html':(i===5?'gallery.html':(i===6?'trends.html':'#')))))))+'">'+(i+1)+'、'+b[0]+'<small>'+b[1]+'</small></a>'}).join('');
  }
  function renderHistory(v){
    var all=(v.history||[]).slice().sort(function(a,b){return (parseInt(a.issue,10)||0)-(parseInt(b.issue,10)||0)});
    var hist=HIST_OPEN?all:all.slice(-HIST_LIMIT);
    document.getElementById('histHead').textContent='近期开奖 · '+XC.fmtIssue(v.issue)+' 已更新 · 共 '+all.length+' 期';
    document.getElementById('hist').innerHTML=hist.length?hist.map(function(h){var nums=XC.norm(h.nums);var sp=nums[6]||{};return '<div class="hrow">'+XC.histLine(h)+'<span class="sub">本期看点:【<em>生肖 '+esc(sp.z||'')+'</em>】 重点:【<u>冷热对照</u>】</span></div>'}).join(''):'<div class="empty">暂无历史数据</div>';
    var btn=document.getElementById('histMore');if(!btn)return;
    btn.hidden=all.length<=HIST_LIMIT;
    btn.textContent=HIST_OPEN?('收起 · 只显示近'+HIST_LIMIT+'期'):('展开全部 '+all.length+' 期');
  }
  function renderHot(){
    var pick=(DATA.pick&&DATA.pick.rows||[]).slice().sort(function(a,b){return (parseInt(b.issue,10)||0)-(parseInt(a.issue,10)||0)});
    var z=(DATA.ziliao&&DATA.ziliao.rows||[]).slice().sort(function(a,b){return (parseInt(b.issue,10)||0)-(parseInt(a.issue,10)||0)});
    var out=[];
    if(pick[0])out.push('<div class="hotrow"><a href="data.html#pick"><span class="t"><b>'+esc(pick[0].issue)+'期:</b> 本期内幕精选 · 精选 '+esc(pick[0].pick&&pick[0].pick.zodiac)+'-'+esc(pick[0].pick&&pick[0].pick.num)+'</span><span class="new">NEW</span></a></div>');
    if(z[0])out.push('<div class="hotrow"><a href="data.html#ziliao"><span class="t"><b>'+esc(z[0].issue)+'期:</b> 内幕资料 · '+esc(z[0].oddEven||'本期')+' '+esc((z[0].threeZodiac||[]).join(''))+'</span><span class="hot">热</span></a></div>');
    out.push('<div class="hotrow"><a href="data.html#ziliao"><span class="t"><b>资料库:</b> 玄机诗象与生肖号码表</span></a></div>');
    out.push('<div class="hotrow"><a href="gallery.html"><span class="t"><b>图库:</b> 开奖海报与主题图集</span></a></div>');
    document.getElementById('hotlist').innerHTML=out.join('');
  }

  var BDL=null,SPMAP=null,DRAWMAP=null,COLORMAP=null;
  var BOARD_DEFS=[
    {key:'pick',title:'本期内幕精选',type:'pick'},
    {key:'wuxiao',title:'五肖五码',type:'wuxiao'},
    {key:'santou',title:'高手三头',type:'santou'},
    {key:'shuangbo',title:'必赢双波',type:'shuangbo'},
    {key:'danshuang',title:'单双',type:'danshuang'},
    {key:'liuxiao',title:'六肖六码',type:'liuxiao'},
    {key:'qiwei',title:'七尾中特',type:'qiwei'},
    {key:'sisha',title:'死杀三肖',type:'sisha'},
    {key:'pingte',title:'平特①肖',type:'pingte'},
    {key:'danshuangsixiao',title:'单双四肖',type:'danshuangsixiao'}
  ];
  function sortRows(rows){return (rows||[]).slice().sort(function(a,b){return (parseInt(a.issue,10)||0)-(parseInt(b.issue,10)||0)})}
  function buildSpecialMap(){
    var map={},all={};
    function add(issue,nums){var a=XC.norm(nums);if(a.length===7){map[XC.short(issue)]=a[6];all[XC.short(issue)]=a.map(function(x){return x.z})}}
    if(DATA&&DATA.manualRaw){add(DATA.manualRaw.issue,DATA.manualRaw.nums);if(DATA.games.newhk&&DATA.games.newhk.nums)add(DATA.games.newhk.issue,DATA.games.newhk.nums);(DATA.manualRaw.history||[]).forEach(function(x){add(x.issue,x.nums)})}
    return {sp:map,all:all};
  }
  function buildColorMap(){
    var m={};try{(DATA.numAttrs.rows||[]).forEach(function(r){if(r.num&&r.color)m[XC.asNum(r.num)]=r.color})}catch(e){}
    return m;
  }
  function specialVisibleAt(issue){
    try{var raw=(DATA&&DATA.manualRaw)||{};var cur=raw.current||raw;var h0=(raw.history&&raw.history[0])||(cur.history&&cur.history[0]);var bi=parseInt((h0&&h0.issue)||cur.issue,10)||0;var br=(h0&&h0.visibleFrom)||cur.visibleFrom||cur.publishedAt||'';if(!bi||!br){var ci=parseInt((raw&&raw.issue)||0,10);return (parseInt(issue,10)||0)<ci?new Date(0):new Date(Date.now()+86400000)}var b=new Date(br);if(isNaN(b.getTime())){var ci2=parseInt((raw&&raw.issue)||0,10);return (parseInt(issue,10)||0)<ci2?new Date(0):new Date(Date.now()+86400000)}var at=new Date(b.getTime()+((parseInt(issue,10)||bi)-bi)*86400000);return new Date(at.getTime()+3600000)}catch(e){return new Date(0)}
  }
  function spOf(row){
    if(row&&row.issue!=null&&Date.now()<specialVisibleAt(row.issue).getTime())return null;
    if(row&&row.special&&row.special.z)return {c:XC.asNum(row.special.c),z:row.special.z,color:row.special.color||''};
    return (SPMAP&&SPMAP[XC.short(row&&row.issue)])||null;
  }
  function colorOf(c){if(COLORMAP&&COLORMAP[XC.asNum(c)])return COLORMAP[XC.asNum(c)];var cls=XC.numClass(c);return cls==='red'?'红':(cls==='blue'?'蓝':'绿')}
  function hitSpan(txt,hit,cls){return '<span class="'+(hit?'hit ':'')+(cls||'')+'">'+esc(txt)+'</span>'}
  function rowWrap(issue,body,extra,sp){
    var sc=sp?(colorOf(sp.color||sp.c)==='红'?'red':(colorOf(sp.color||sp.c)==='蓝'?'blue':'green')):'';
    var spHtml=sp?(' <span class="sp">开:'+esc(sp.z)+'<span class="sp-'+sc+'">'+esc(sp.c)+'</span></span>'):'';
    return '<div class="board-row"><span class="bi">'+esc(XC.short(issue))+'</span><span class="bd">'+body+spHtml+'</span><span class="bo">'+extra+'</span></div>';
  }
  function boardRows(def){
    if(def.type==='pick')return sortRows(DATA.pick.rows||[]).slice(-6);
    if(!BDL||!BDL[def.key])return [];
    return sortRows((BDL[def.key]||{}).rows||[]).slice(-6);
  }
  function renderBoardRow(def,row){
    var sp=spOf(row);
    if(def.type==='pick'){
      if(!row||!row.pick)return '';
      var pz=row.pick.zodiac,pn=XC.asNum(row.pick.num);
      var hz=!!(sp&&sp.z===pz),hn=!!(sp&&sp.c===pn);
      return rowWrap(row.issue,'精选 '+hitSpan(pz,hz)+'-'+hitSpan(pn,hn),'<small>'+esc(row.seven&&row.seven.zodiac?row.seven.zodiac.slice(0,3).join(''):'')+'</small>',sp);
    }
    if(def.type==='wuxiao'||def.type==='liuxiao'){
      var list=row.list||[];var text=list.map(function(x){var hit=!!(sp&&(x.z===sp.z||XC.asNum(x.c)===sp.c));return hitSpan(x.z+x.c,hit)}).join(' ');
      return rowWrap(row.issue,text,'',sp);
    }
    if(def.type==='santou'){
      var head=sp?Math.floor(parseInt(sp.c,10)/10):-1;var text=(row.heads||[]).map(function(x){return hitSpan(x+'头',x===head)}).join(' ');
      return rowWrap(row.issue,text,'',sp);
    }
    if(def.type==='shuangbo'){
      var col=sp?colorOf(sp.color||sp.c):'';var text=(row.waves||[]).map(function(x){return hitSpan(x+'波',x===col)}).join(' + ');
      return rowWrap(row.issue,text,'',sp);
    }
    if(def.type==='danshuang'){
      var isOdd=sp?(parseInt(sp.c,10)%2===1):false;var oe=hitSpan(row.oddEven||'',sp&&((row.oddEven==='单数')===isOdd));var zs=(row.zodiacs||[]).map(function(z){return hitSpan(z,sp&&z===sp.z)}).join('');
      return rowWrap(row.issue,oe+' + '+zs,'',sp);
    }

    out+=tenSection('玄机诗象',poHtml,'','poems');
    var _zl=(DATA.ziliao&&DATA.ziliao.rows||[]).slice().sort(function(a,b){return (parseInt(b.issue,10)||0)-(parseInt(a.issue,10)||0)}).slice(0,3);
    var zlHtml=_zl.map(function(r){var t=String(r.text||'内幕资料');var sum=[r.oddEven?'单双 '+r.oddEven:'',(r.threeZodiac||[]).length?'三肖 '+r.threeZodiac.join(''):'',r.result&&r.result.z?'开 '+r.result.z+r.result.c:''].filter(Boolean).join(' · ')||'内幕资料 · 每日更新';return '<div class="ten-zl-row"><b>'+esc(XC.short(r.issue))+'期</b><div><span class="ten-zl-t">'+esc(t)+'</span><span class="ten-zl-s">'+esc(sum)+'</span></div></div>'}).join('')||'<div class="new-empty">暂无内幕资料</div>';
    if(_zl.length)zlHtml+='<a class="ten-zl-more" href="data.html#ziliao">查看全部 ›</a>';
    out+=tenSection('内幕资料',zlHtml,'','ziliao');

    // 8 三头中特
    var st=ascRows((BDL.santou||{}).rows||[]).slice(-8);
    var stH=st.map(function(r){var sp=spOf(r),hs=r.heads||[],hh=hs.map(function(h,i){var on=!!(sp&&Math.floor(parseInt(sp.c,10)/10)===h);return '<span class="ten-head '+(i%2?'g':'r')+(on?' ten-hit':'')+'">'+h+'头</span>'}).join('');return '<div class="ten-row"><span class="ten-iss">'+esc(XC.short(r.issue))+'期</span><span class="ten-mid">三头中特 <span class="ten-hi">【'+hh+'】</span></span><span class="ten-res">'+(sp?('開:'+esc(sp.z)+'<span class="wave-'+waveClass(sp.c)+'">+'+esc(sp.c)+'</span>'):'開:? <b class="ten-wait">待</b>')+'</span></div>'}).join('');
    out+=tenSection('三头中特',stH||'<div class="new-empty">暂无三头资料</div>','','santou');
    // 9 四尾12码
    var qw=ascRows((BDL.qiwei||{}).rows||[]).slice(-6);
    var qH=qw.map(function(r){var sp=spOf(r),tails=String(r.tails||'').split('').filter(function(x){return /\d/.test(x)}),four=tails.slice(0,4),seven=tails.slice(0,7),codes=[];four.forEach(function(t){var arr=[];for(var n=1;n<=49;n++){if(String(n%10)===t)arr.push(('0'+n).slice(-2))}codes=codes.concat(arr.slice(0,3))});codes=codes.slice(0,12);var spTail=sp?String(parseInt(sp.c,10)%10):'';var th=four.map(function(t){return '<span class="'+(t===spTail?'ten-hit':'')+'">'+t+'</span>'}).join('-');var sh=seven.map(function(t){return '<span class="'+(t===spTail?'ten-hit':'')+'">'+t+'</span>'}).join('-');var ch=codes.map(function(c){return '<span class="'+(sp&&XC.asNum(c)===sp.c?'ten-hit':'')+'">'+c+'</span>'}).join('.');return '<div class="ten-tail"><div class="ten-tail-h">'+esc(XC.short(r.issue))+'（四尾12码）彩霸王</div><div class="ten-tail-l">12码：'+ch+'</div><div class="ten-tail-l">4尾：'+th+'</div><div class="ten-tail-l">7尾：'+sh+'</div></div>'}).join('');
    out+=tenSection('四尾12码',qH||'<div class="new-empty">暂无尾数资料</div>','','qiwei');
    // 10 两波中特
    var lbRows=secRows('liangbo');var lbBase=(lbRows.length?lbRows:sb).slice(-8);var s2=lbBase.map(function(r){var sp=spOf(r);if(!sp&&r.special)sp=r.special;var ws=r.waves||[],col=sp?colorOf(sp.c):'',hit=!!(sp&&ws.indexOf(col)>=0);var wh=ws.map(function(w){return '<span class="ten-hit'+(w===col?' ten-wave':'')+'">'+esc(w)+'波</span>'}).join('');return '<div class="ten-row"><span class="ten-iss">'+esc(XC.short(r.issue))+'期</span><span class="ten-mid">两波中特 <span class="ten-hi">【'+wh+'】</span></span><span class="ten-res">'+(sp?('特开:'+esc(sp.z)+'<span class="wave-'+waveClass(sp.c)+'">+'+esc(sp.c)+'</span> <b class="'+(hit?'ten-ok':'ten-no')+'">'+(hit?'准':'错')+'</b>'):'特开:? <b class="ten-wait">待</b>')+'</span></div>'}).join('');
    out+=tenSection('两波中特',s2||'<div class="new-empty">暂无两波资料</div>','','liangbo');
    var known=['liuxiao','jiaye','shuangbo','danshuang','jiuxiao','ersha','pick','santou','qiwei','liangbo','wuxiao'];

      var rs=(s.rows||[]).map(function(r){var mid=r.text||r.note||'';if(!mid){var z=r.zodiacs||r.pair||r.waves||r.heads||r.tails||[];if(Array.isArray(z))z=z.join('');if(r.list&&r.list.length){z=r.list.map(function(x){return x.z+x.c}).join(' ')}mid=(z||'')+(r.nums&&Array.isArray(r.nums)?' '+r.nums.join(' '):(r.nums||''));if(r.special&&r.special.z)mid+=' 开:'+r.special.z+(r.special.c||'');}return '<div class="ten-row"><span class="ten-iss">'+esc(r.issue||'')+'期</span><span class="ten-mid">'+esc(mid)+'</span></div>'}).join('');
      out+=tenSection(s.title||s.id,rs||'<div class="new-empty">暂无资料</div>',s.note||'',s.id);
    });
    el.innerHTML=out;
  }
  function renderAll(){

    document.getElementById('zodNow').textContent='当前：'+v.name+' · '+XC.fmtIssue(v.issue);
    document.getElementById('marqueeText').innerHTML='彩霸王 · 开奖数据每日更新 · 资料仅供参考 &nbsp;<b>开奖直播</b> <i>历史归档</i> <u>生肖玄机</u> <em>图库精选</em>';
    renderTenBlocks();renderMoreBlocks();

  var _rf=document.getElementById('refreshBtn');_rf.addEventListener('click',function(){load()});_rf.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();load()}});
  function setRefreshBusy(on){var el=document.getElementById('refreshBtn');if(!el)return;if(on){el.classList.add('busy');el.innerHTML='<i class="rf-spin"></i>刷新中…'}else{el.classList.remove('busy');el.innerHTML='<em>↻</em>刷新<br>记录'}}

    return XC.load().then(function(d){if(!d||(!d.games||!d.games.length)&&!((d.manualRaw&&d.manualRaw.issue)||((d.siteData&&d.siteData.sections)||[]).length))throw new Error("数据为空");DATA=d;var _maps=buildSpecialMap();SPMAP=_maps.sp;DRAWMAP=_maps.all;COLORMAP=buildColorMap();document.getElementById('loading').style.display='none';renderAll();renderHot();renderPoem();renderZodiac();startTick();if(_wasWaiting)maybeReveal(false);else maybeReveal(true);return XC.loadBoards()}).then(function(b){BDL=b||{};renderTenBlocks();renderMoreBlocks()}).catch(function(e){setLoading('数据读取失败，请稍后刷新',true);console.error(e);throw e}).then(function(){REFRESHING=false;setRefreshBusy(false)},function(){REFRESHING=false;setRefreshBusy(false);var el=document.getElementById('refreshBtn');if(el){el.innerHTML='刷新失败，稍后重试';setTimeout(function(){if(el&&!REFRESHING)el.innerHTML='<em>↻</em>刷新<br>记录'},2200)}})

<script>(function(){
  var CFG={endpoint:'https://sgp.cloud.appwrite.io/v1',project:'6aff4c2f0016ee43abad',database:'lottery',collection:'live_state',prodDoc:'state',testDoc:'state_test',fn:'https://sgp.cloud.appwrite.io/v1/functions/lottery-api/executions'};
  var test=new URLSearchParams(location.search).get('livetest')==='1';
  var docId=test?CFG.testDoc:CFG.prodDoc;
  var client=null,unsub=null,last='',primed=false,timer=null;
  function refresh(){try{if(window.__xcRefreshData)window.__xcRefreshData();else if(typeof window.load==='function')window.load();else if(window.__xcRefresh)window.__xcRefresh();else location.reload()}catch(e){location.reload()}}
  function onDoc(p){try{var d=p&&(p.payload||p);if(!d||!d.issue)return;if(!primed){primed=true;last=String(d.issue);return;}if(String(d.issue)===last)return;last=String(d.issue);refresh()}catch(e){}}
  function connect(){
    if(document.hidden||client)return;
    if(!window.Appwrite){return;}
    try{client=new window.Appwrite.Client().setEndpoint(CFG.endpoint).setProject(CFG.project);unsub=client.subscribe('databases.'+CFG.database+'.collections.'+CFG.collection+'.documents.'+docId,onDoc);}catch(e){client=null}
  }
  function disconnect(){try{if(unsub)unsub()}catch(e){}try{if(client)client.disconnect()}catch(e){}unsub=null;client=null}
  document.addEventListener('visibilitychange',function(){if(document.hidden)disconnect();else connect()});
  connect();setTimeout(connect,1500);
  // 兜底：30s 拉一次（后端接口未就绪时静默失败）
  timer=setInterval(function(){try{fetch(CFG.fn,{method:'POST',headers:{'X-Appwrite-Project':CFG.project,'Content-Type':'application/json'},body:JSON.stringify({path:'/live/latest?doc='+docId,method:'GET',async:false})}).then(function(r){return r.json()}).then(function(j){var d=null;try{d=JSON.parse(j.responseBody||'null')}catch(e){}if(d&&d.issue){if(!primed){primed=true;last=String(d.issue);return;}if(String(d.issue)!==last){last=String(d.issue);refresh()}}}).catch(function(){})}catch(e){}},30000);
})();</script>
